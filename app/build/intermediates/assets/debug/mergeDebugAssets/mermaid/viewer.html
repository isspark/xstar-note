<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; background:#ffffff; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #status { position: sticky; top:0; background:#f2f4f7; color:#555; font-size:13px; padding:6px 14px; border-bottom:1px solid #e5e7eb; }
  #wrap { padding:18px; overflow:auto; }
  .placeholder { color:#999; }
  .offline { color:#b00020; margin-bottom:10px; white-space:pre-wrap; }
  pre.code { background:#f6f8fa; border:1px solid #e0e0e0; border-radius:8px; padding:12px; font-size:12px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .svgwrap svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div id="status">加载渲染引擎中…</div>
<div id="wrap"><p class="placeholder">正在渲染 Mermaid 图表…</p></div>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
  window.__code = null;
  var attempts = 0;
  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fallback(msg){
    var wrap = document.getElementById('wrap');
    wrap.innerHTML = '<div class="offline">渲染失败：' + esc(msg) + '<br>以下是原始 mermaid 代码：</div>' +
      '<pre class="code">' + esc(window.__code || "") + '</pre>';
    document.getElementById('status').textContent = '渲染失败';
  }
  function doRender(){
    var code = window.__code || "";
    if (!code.trim()) { fallback("代码为空"); return; }
    try {
      if (typeof mermaid === "undefined") throw new Error("未联网或 CDN 不可用");
      mermaid.initialize({ startOnLoad:false, theme:"default", securityLevel:"loose", flowchart:{ curve:"basis" } });
      mermaid.render("mmd" + Date.now(), code)
        .then(function(res){
          var wrap = document.getElementById('wrap');
          wrap.innerHTML = '<div class="svgwrap">' + res.svg + '</div>';
          document.getElementById('status').textContent = "渲染成功";
        })
        .catch(function(e){ fallback(e && e.message ? e.message : String(e)); });
    } catch(e) {
      fallback(e && e.message ? e.message : String(e));
    }
  }
  function waitAndRender(){
    attempts++;
    if (typeof mermaid !== "undefined") { doRender(); return; }
    if (attempts > 40) { fallback("未联网或 CDN 不可用"); return; }
    setTimeout(waitAndRender, 500);
  }
  window.__renderMermaid = function(){
    attempts = 0;
    waitAndRender();
  };
</script>
</body>
</html>
